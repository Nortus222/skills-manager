name: Windows packaging diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reproduce duplicate CLI packaging and test removing the duplicate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force src-tauri/target/x86_64-pc-windows-msvc/release, src-tauri/binaries, dist | Out-Null
          Set-Content dist/index.html '<html>Packaging probe</html>'
          $stub = "$env:WINDIR/System32/whoami.exe"
          Copy-Item $stub src-tauri/target/x86_64-pc-windows-msvc/release/skills-manager.exe
          Copy-Item $stub src-tauri/target/x86_64-pc-windows-msvc/release/skills-manager-cli.exe
          Copy-Item $stub src-tauri/binaries/skills-manager-cli-x86_64-pc-windows-msvc.exe
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content src-tauri/packaging-probe.conf.json
          & npx tauri bundle --target x86_64-pc-windows-msvc --bundles msi --verbose --no-sign --config src-tauri/tauri.release.conf.json --config src-tauri/packaging-probe.conf.json 2>&1 | Tee-Object before.log
          $before = $LASTEXITCODE
          Get-Content src-tauri/target/x86_64-pc-windows-msvc/release/wix/x64/main.wxs | Select-String -Pattern 'skills-manager-cli' -Context 2,2
          if ($before -eq 0) { throw 'Original MSI unexpectedly passed; hypothesis not reproduced' }
          if (-not (Select-String -Path before.log -Pattern 'ICE30|LGHT0204|same target|duplicate|LGHT0091|LGHT0369' -Quiet)) { throw 'Original MSI failed for a different reason' }
          Remove-Item -Recurse -Force src-tauri/target/x86_64-pc-windows-msvc/release/bundle -ErrorAction SilentlyContinue
          '{"bundle":{"createUpdaterArtifacts":false,"externalBin":[]}}' | Set-Content src-tauri/packaging-probe.conf.json
          & npx tauri bundle --target x86_64-pc-windows-msvc --bundles msi --verbose --no-sign --config src-tauri/tauri.release.conf.json --config src-tauri/packaging-probe.conf.json 2>&1 | Tee-Object after.log
          if ($LASTEXITCODE -ne 0) { throw 'MSI still failed after removing duplicate externalBin' }
          if (-not (Test-Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi)) { throw 'Missing MSI' }
          Write-Host 'PASS: original config fails with duplicate-file error; removing duplicate externalBin produces MSI.'
